<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#102a43" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Respect Talk AI" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/styles.css" />
    <title>Respect Talk AI</title>
  </head>
  <body>
    <main class="shell">
      <header><span class="eyebrow">EAR-SIDE CONVERSATION COACH</span><h1>Respect Talk <em>AI</em></h1><p>会話をさえぎらず、次のひと言をそっと耳元へ。</p></header>

      <section class="card headphone-card" aria-labelledby="headphone-title">
        <div><h2 id="headphone-title">🎧 イヤホン確認</h2><p>iPhoneの音声出力先でBluetoothイヤホンを選んでください。</p></div>
        <button id="audio-test" class="secondary">音声テスト</button>
      </section>

      <section class="status-panel" aria-live="polite">
        <div id="status-icon" class="status-icon">🎙</div>
        <p id="status-label" class="status-label">開始前です</p>
        <p id="status-help">イヤホンを確認して、会話サポートを開始してください</p>
        <div class="pulse" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <button id="toggle-session" class="primary">会話サポートを開始</button>
        <p id="support-note" class="support-note" hidden></p>
      </section>

      <section id="result" class="card result-card" hidden aria-live="polite">
        <div class="result-heading"><span>会話メモ</span><span id="category-badge" class="badge"></span></div>
        <p id="transcript" class="transcript"></p>
        <dl><div><dt>感情</dt><dd id="emotion"></dd></div><div><dt>会話意図</dt><dd id="intent"></dd></div><div><dt>推奨対応</dt><dd id="action"></dd></div></dl>
        <h3>次のひと言</h3><ol id="suggestions"></ol>
      </section>

      <section class="card demo-card">
        <div class="section-title"><div><span class="eyebrow">TRY WITHOUT A MICROPHONE</span><h2>デモ会話テスト</h2></div><span>🧪</span></div>
        <label for="demo-input">相手の発言</label>
        <textarea id="demo-input" rows="3">最近、仕事で失敗して落ち込んでいるんだ</textarea>
        <div class="demo-actions"><button id="run-demo" class="primary">分析して提案</button><button id="speak-demo" class="secondary" disabled>第1候補を読み上げ</button></div>
      </section>

      <footer>音声は端末内のブラウザ機能で処理します。APIキー・有料APIは使用しません。</footer>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
